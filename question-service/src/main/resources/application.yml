server:
  port: 8083

spring:
  application:
    name: question-service
  datasource:
    url: jdbc:h2:mem:questiondb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# URLs de otros servicios: configuración externalizada, sin literales en el código
validation:
  service:
    url: http://localhost:8082
lifecycle:
  service:
    url: http://localhost:8084

logging:
  level:
    co.edu.unicauca: INFO
